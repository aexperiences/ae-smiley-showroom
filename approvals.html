<head>

<link rel="stylesheet" href="smiley.css">
</head>
<body>
<script src="smiley.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Smiley;
  var content = S.mount({ active:"approvals.html", crumb:"Approval desk" });

  content.appendChild(S.page("Approval desk","Anything that spends money, sends to a patient, or changes a fee waits here for a named person. Nothing leaves the building on its own."));
  var a=S.approvals();
  if(!a.length) content.appendChild(S.card('<h2>Nothing waiting</h2><p class="sub">When the system wants to send a recall blast, write off a balance, or adjust a fee, it stops here first and puts your name on the decision.</p>'));
  content.appendChild(S.card('<h2>What always stops here</h2><ul>'+
    ['Any message going out to a patient list','Writing off a patient balance','Changing a fee on the schedule',
     'Sending a document for signature','Refunding a payment','Anything that would spend money']
    .map(function(x){ return '<li>'+x+'</li>'; }).join("")+'</ul>'));

})();
</script>
</body>
</html>
