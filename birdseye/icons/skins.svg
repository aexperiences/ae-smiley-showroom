<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#3d4750"/><stop offset="46%" stop-color="#1e252b"/><stop offset="100%" stop-color="#080b0e"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".16"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#c9d2d8"/><stop offset="42%" stop-color="#7f8b94"/><stop offset="100%" stop-color="#3e474e"/></linearGradient>
<linearGradient id="ferr" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#f3f6f8"/><stop offset="38%" stop-color="#a3aeb6"/><stop offset="100%" stop-color="#4d565d"/></linearGradient>
<linearGradient id="paint" x1="0" y1="0" x2="0.5" y2="1">
<stop offset="0%" stop-color="#ffa858"/><stop offset="55%" stop-color="#e4832b"/><stop offset="100%" stop-color="#a2540f"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="906" rx="340" ry="28" fill="#05070a" opacity=".6"/>

<!-- the swatch fan, behind -->
<g>
  <g transform="rotate(-26 300 640)"><rect x="150" y="470" width="176" height="330" rx="26" fill="#2f7d8c"/>
    <rect x="150" y="470" width="176" height="330" rx="26" fill="none" stroke="#0f333a" stroke-width="8"/></g>
  <g transform="rotate(-13 300 640)"><rect x="180" y="452" width="176" height="330" rx="26" fill="#2f8f6b"/>
    <rect x="180" y="452" width="176" height="330" rx="26" fill="none" stroke="#123a2b" stroke-width="8"/></g>
  <g transform="rotate(0 300 640)"><rect x="212" y="440" width="176" height="330" rx="26" fill="#e4a62b"/>
    <rect x="212" y="440" width="176" height="330" rx="26" fill="none" stroke="#5b4210" stroke-width="8"/></g>
  <g transform="rotate(13 300 640)"><rect x="244" y="452" width="176" height="330" rx="26" fill="#7a5aa8"/>
    <rect x="244" y="452" width="176" height="330" rx="26" fill="none" stroke="#2f2242" stroke-width="8"/></g>
  <g transform="rotate(26 300 640)"><rect x="276" y="470" width="176" height="330" rx="26" fill="#b4485e"/>
    <rect x="276" y="470" width="176" height="330" rx="26" fill="none" stroke="#471c25" stroke-width="8"/></g>
</g>

<!-- the brush -->
<g transform="rotate(34 640 500)">
  <rect x="588" y="118" width="104" height="392" rx="50" fill="#05070a" opacity=".5" transform="translate(12 16)"/>
  <rect x="588" y="118" width="104" height="392" rx="50" fill="url(#handle)"/>
  <rect x="604" y="140" width="26" height="350" rx="13" fill="#ffffff" opacity=".38"/>
  <rect x="580" y="498" width="120" height="96" rx="18" fill="url(#ferr)"/>
  <g stroke="#5a646b" stroke-width="7" opacity=".7">
    <path d="M580 524 H700"/><path d="M580 560 H700"/>
  </g>
  <path d="M586 588 L694 588 L706 730 q4 44 -46 44 L626 774 q-50 0 -46 -44 Z" fill="url(#paint)"/>
  <path d="M600 592 L618 592 L612 762 L600 762 Z" fill="#ffffff" opacity=".26"/>
  <path d="M586 588 L694 588 L697 622 L583 622 Z" fill="#a2540f" opacity=".45"/>
</g>

<!-- fresh paint stroke across the bottom -->
<path d="M156 848 q120 -46 250 -12 q140 36 268 -8 q92 -32 194 4"
      fill="none" stroke="#e4832b" stroke-width="46" stroke-linecap="round" opacity=".95"/>
<path d="M156 848 q120 -46 250 -12 q140 36 268 -8 q92 -32 194 4"
      fill="none" stroke="#ffc48c" stroke-width="14" stroke-linecap="round" opacity=".55"/>
</svg>
