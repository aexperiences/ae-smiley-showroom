<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#7d97ad"/><stop offset="46%" stop-color="#42596f"/><stop offset="100%" stop-color="#151d26"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".20"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e8ebe6"/></linearGradient>
<linearGradient id="env" x1="0" y1="0" x2="0.2" y2="1">
<stop offset="0%" stop-color="#e6dcc6"/><stop offset="100%" stop-color="#c2b494"/></linearGradient>
<linearGradient id="envF" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#d8cbaf"/><stop offset="100%" stop-color="#ab9b7b"/></linearGradient>
<linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f0e8d6"/><stop offset="100%" stop-color="#cfc0a0"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="902" rx="344" ry="30" fill="#0c1219" opacity=".55"/>

<!-- the flap, thrown open behind everything -->
<path d="M 148 604 L 512 302 L 876 604 L 876 640 L 148 640 Z" fill="url(#flap)"/>
<path d="M 148 604 L 512 302 L 876 604 L 858 604 L 512 328 L 166 604 Z" fill="#fff" opacity=".35"/>

<!-- the job card coming out of the envelope -->
<g transform="rotate(-4 512 470)">
  <rect x="286" y="212" width="452" height="470" rx="22" fill="#101820" opacity=".38" transform="translate(14 18)"/>
  <rect x="286" y="212" width="452" height="470" rx="22" fill="url(#card)"/>
  <rect x="286" y="212" width="452" height="66" rx="22" fill="#2f7d8c"/>
  <rect x="286" y="256" width="452" height="22" fill="#2f7d8c"/>
  <circle cx="336" cy="245" r="17" fill="#e4832b"/>
  <rect x="368" y="234" width="196" height="22" rx="11" fill="#eaf1f3" opacity=".92"/>
  <!-- the job: address, trade, the line items -->
  <rect x="330" y="322" width="300" height="22" rx="11" fill="#5b6873"/>
  <rect x="330" y="366" width="212" height="17" rx="8" fill="#9aa6b0"/>
  <rect x="330" y="400" width="26" height="26" rx="8" fill="#2f7d8c"/>
  <rect x="374" y="406" width="242" height="16" rx="8" fill="#aab5bd"/>
  <rect x="330" y="452" width="26" height="26" rx="8" fill="#e4a62b"/>
  <rect x="374" y="458" width="196" height="16" rx="8" fill="#aab5bd"/>
  <rect x="330" y="504" width="26" height="26" rx="8" fill="#2f8f6b"/>
  <rect x="374" y="510" width="224" height="16" rx="8" fill="#aab5bd"/>
  <!-- filed stamp -->
  <rect x="330" y="550" width="176" height="46" rx="14" fill="#2f8f6b" opacity=".16"/>
  <path d="M 356 573 l 18 19 l 34 -40" fill="none" stroke="#2f8f6b" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="424" y="565" width="66" height="15" rx="7" fill="#2f8f6b" opacity=".55"/>
</g>

<!-- the envelope body, in front, holding it -->
<path d="M 148 596 L 876 596 L 876 858 Q 876 886 846 886 L 178 886 Q 148 886 148 858 Z" fill="url(#env)"/>
<path d="M 148 596 L 512 806 L 876 596 L 876 640 L 512 850 L 148 640 Z" fill="url(#envF)"/>
<path d="M 148 596 L 512 806 L 876 596 L 876 610 L 512 820 L 148 610 Z" fill="#fff" opacity=".28"/>
<path d="M 148 858 Q 148 886 178 886 L 846 886 Q 876 886 876 858 L 876 806 L 512 872 L 148 806 Z"
      fill="#0f151b" opacity=".14"/>

<!-- the clip that pins the mail to the job -->
<path d="M 726 214 q 0 -46 46 -46 q 46 0 46 46 l 0 168 q 0 30 -30 30 q -30 0 -30 -30 l 0 -148"
      fill="none" stroke="#c9d3da" stroke-width="26" stroke-linecap="round"/>
<path d="M 726 214 q 0 -46 46 -46 q 46 0 46 46 l 0 168 q 0 30 -30 30 q -30 0 -30 -30 l 0 -148"
      fill="none" stroke="#8a959e" stroke-width="10" stroke-linecap="round"/>
</svg>
