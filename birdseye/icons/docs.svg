<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#8a8378"/><stop offset="46%" stop-color="#4a453d"/><stop offset="100%" stop-color="#161412"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".20"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
<stop offset="0%" stop-color="#59636b"/><stop offset="100%" stop-color="#22292e"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#edeee9"/></linearGradient>
<linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#f4a25c"/><stop offset="46%" stop-color="#e4832b"/><stop offset="100%" stop-color="#8f4a0d"/></linearGradient>
<linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#e9edf0"/><stop offset="50%" stop-color="#aab4bb"/><stop offset="100%" stop-color="#5c666d"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="880" rx="360" ry="30" fill="#0c0a08" opacity=".55"/>

<!-- tablet -->
<g transform="rotate(-6 512 520)">
  <rect x="146" y="228" width="732" height="576" rx="46" fill="#0f1316" opacity=".5" transform="translate(14 18)"/>
  <rect x="146" y="228" width="732" height="576" rx="46" fill="url(#body)"/>
  <rect x="146" y="228" width="732" height="576" rx="46" fill="none" stroke="#141a1e" stroke-width="10"/>
  <rect x="186" y="268" width="652" height="496" rx="20" fill="url(#scr)"/>
  <!-- doc lines -->
  <g fill="#c8cfd3">
    <rect x="230" y="312" width="240" height="22" rx="11" fill="#46525a"/>
    <rect x="230" y="364" width="470" height="16" rx="8"/>
    <rect x="230" y="400" width="420" height="16" rx="8"/>
    <rect x="230" y="436" width="470" height="16" rx="8"/>
  </g>
  <!-- signature line -->
  <rect x="230" y="676" width="404" height="10" rx="5" fill="#9aa5ac"/>
  <rect x="230" y="702" width="150" height="14" rx="7" fill="#c8cfd3"/>
  <!-- the signature -->
  <path d="M244 660 q40 -104 74 -18 q22 56 44 -34 q18 -74 44 4 q14 46 40 -6 q22 -44 46 22 q16 40 46 -18 q22 -44 60 4"
        fill="none" stroke="#2f4a8c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- stylus -->
<g transform="rotate(28 730 520)">
  <rect x="686" y="180" width="86" height="500" rx="42" fill="#5b3208" opacity=".45" transform="translate(12 16)"/>
  <rect x="686" y="180" width="86" height="500" rx="42" fill="url(#pen)"/>
  <rect x="700" y="196" width="22" height="470" rx="11" fill="#ffffff" opacity=".28"/>
  <rect x="686" y="596" width="86" height="34" rx="12" fill="#8f4a0d"/>
  <path d="M686 630 L772 630 L740 762 q-11 26 -22 0 Z" fill="url(#nib)"/>
  <path d="M722 700 L736 700 L734 758 q-3 12 -6 0 Z" fill="#2f3a41"/>
</g>
</svg>
