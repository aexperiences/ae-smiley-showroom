<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Join the meeting · Cedar Ridge Dental</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/espo-theme.css">
<style>
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,#22384c,#1a2b3a)}
  .card{max-width:440px;width:100%;background:var(--char);border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}
  .mark{width:60px;height:60px;border-radius:15px;margin:0 auto 14px;display:block}
  h1{font-family:Fraunces,Georgia,serif;font-size:23px;color:#fff;margin:0 0 4px}
  .tagline{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--indigo2);margin:0 0 12px;font-weight:600}
  p.sub{color:var(--mut);font-size:13.5px;margin:0 0 20px}
  label{display:block;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:0 0 5px}
  input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font:inherit;font-size:15px;background:var(--char2);color:var(--ink);margin-bottom:14px}
  button{width:100%;background:linear-gradient(180deg,var(--indigo),var(--indigo3));color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-family:Fraunces,Georgia,serif;font-size:16px;cursor:pointer}
  button:hover{filter:brightness(1.06)}
  .foot{margin-top:16px;font-size:11.5px;color:var(--mut)}
  .err{color:#e8a33d;font-size:13px;margin-bottom:10px;display:none}
  a{color:var(--indigo2)}
</style>
<script>window.SLEEVES_API='https://ae-connect-api.vercel.app';</script>
</head>
<body>
<div class="card" id="card">
  <img class="mark" src="/icon-rounded-192.png" alt="Cedar Ridge Dental">
  <h1>Join the meeting</h1>
  <div class="tagline">Cedar Ridge Dental · Video</div>
  <p class="sub" id="sub">You've been invited to a live video call.</p>
  <div id="form">
    <label for="nm">Your name</label>
    <input id="nm" placeholder="First &amp; last" autocomplete="name">
    <div class="err" id="err" style="display:none"></div>
    <button id="joinBtn">Join the call →</button>
    <div class="foot">Your camera and microphone stay on your device — this connects you directly. No app or account needed.</div>
  </div>
</div>
<div class="ae-credit"><img src="/ae-credit-mark.svg" alt=""><span>Powered by Accelerated Experiences, LLC</span></div>
<script src="/smiley-rtc.js"></script>
<script>
  var room=(new URLSearchParams(location.search).get('room')||'').trim();
  var nm=document.getElementById('nm'), err=document.getElementById('err');
  try{ var last=localStorage.getItem('espo_meet_name'); if(last)nm.value=last; }catch(e){}
  if(!room){ document.getElementById('form').style.display='none'; document.getElementById('sub').innerHTML='<span style="color:#e8a33d">This link is missing its meeting room. Ask whoever invited you to resend it.</span>'; }
  function go(){
    var name=(nm.value||'').trim();
    if(!name){ err.textContent='Please enter your name.'; err.style.display='block'; nm.focus(); return; }
    try{ localStorage.setItem('espo_meet_name',name); }catch(e){}
    if(!window.SmileyMeet){ err.textContent='Video is still loading — try again in a moment.'; err.style.display='block'; return; }
    SmileyMeet.open({ room:room, displayName:name, subject:'Cedar Ridge Dental', outreach:true, onClose:function(){ document.getElementById('sub').innerHTML='You’ve left the call. You can close this tab, or <a href="#" onclick="location.reload();return false">rejoin</a>.'; } });
  }
  document.getElementById('joinBtn').addEventListener('click',go);
  nm.addEventListener('keydown',function(e){ if(e.key==='Enter')go(); });
</script>
</body>
</html>
